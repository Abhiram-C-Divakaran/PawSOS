version: '3.8'

services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: pawreach_staging_frontend
    ports:
      - "80:80"
    environment:
      - VITE_API_BASE_URL=${STAGING_API_URL:?STAGING_API_URL required}
    depends_on:
      - backend
    networks:
      - pawreach_staging_net
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: pawreach_staging_backend
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=${DATABASE_URL:?DATABASE_URL required}
      - REDIS_URL=${REDIS_URL:?REDIS_URL required}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:?JWT_SECRET_KEY required (minimum 32 chars)}
      - JWT_ALGORITHM=HS256
      - ACCESS_TOKEN_EXPIRE_MINUTES=30
      - REFRESH_TOKEN_EXPIRE_DAYS=7
      - CORS_ORIGINS=${CORS_ORIGINS:?CORS_ORIGINS required}
      - ENVIRONMENT=staging
      - STORAGE_PROVIDER=${STORAGE_PROVIDER:?STORAGE_PROVIDER required (s3)}
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID:-}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY:-}
      - AWS_REGION=${AWS_REGION:-ap-south-1}
      - S3_BUCKET_NAME=${S3_BUCKET_NAME:-}
      - FIREBASE_CREDENTIALS_PATH=${FIREBASE_CREDENTIALS_PATH:-}
      - SENTRY_DSN=${SENTRY_DSN:-}
      - COOKIE_SECURE=${COOKIE_SECURE:-true}
      - COOKIE_SAMESITE=lax
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - pawreach_staging_net
    restart: unless-stopped

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: pawreach_staging_worker
    command: celery -A app.tasks.celery_app.celery_app worker --loglevel=INFO -Q dispatch,notifications,default
    environment:
      - DATABASE_URL=${DATABASE_URL:?DATABASE_URL required}
      - REDIS_URL=${REDIS_URL:?REDIS_URL required}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:?JWT_SECRET_KEY required (minimum 32 chars)}
      - ENVIRONMENT=staging
      - STORAGE_PROVIDER=${STORAGE_PROVIDER:?STORAGE_PROVIDER required (s3)}
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID:-}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY:-}
      - AWS_REGION=${AWS_REGION:-ap-south-1}
      - S3_BUCKET_NAME=${S3_BUCKET_NAME:-}
      - FIREBASE_CREDENTIALS_PATH=${FIREBASE_CREDENTIALS_PATH:-}
      - CELERY_HEARTBEAT_INTERVAL_SECONDS=10.0
      - CELERY_HEARTBEAT_TTL_SECONDS=60
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - pawreach_staging_net
    restart: unless-stopped

  beat:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: pawreach_staging_beat
    command: celery -A app.tasks.celery_app.celery_app beat --loglevel=INFO --pidfile=/tmp/celerybeat.pid
    environment:
      - DATABASE_URL=${DATABASE_URL:?DATABASE_URL required}
      - REDIS_URL=${REDIS_URL:?REDIS_URL required}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:?JWT_SECRET_KEY required (minimum 32 chars)}
      - ENVIRONMENT=staging
      - DISPATCH_BEAT_INTERVAL_SECONDS=20.0
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - pawreach_staging_net
    restart: unless-stopped

  db:
    image: postgis/postgis:15-3.3
    container_name: pawreach_staging_db
    environment:
      - POSTGRES_DB=${POSTGRES_DB:-pawreach_staging}
      - POSTGRES_USER=${POSTGRES_USER:-pawreach_user}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD required}
    volumes:
      - pawreach_staging_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-pawreach_user} -d $${POSTGRES_DB:-pawreach_staging}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - pawreach_staging_net
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: pawreach_staging_redis
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?REDIS_PASSWORD required}"]
    volumes:
      - pawreach_staging_redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:?REDIS_PASSWORD required}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - pawreach_staging_net
    restart: unless-stopped

networks:
  pawreach_staging_net:
    driver: bridge

volumes:
  pawreach_staging_pgdata:
  pawreach_staging_redisdata:
