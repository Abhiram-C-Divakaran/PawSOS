version: '3.8'

services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: pawreach_staging_frontend
    ports:
      - "80:80"
    environment:
      - VITE_API_BASE_URL=${STAGING_API_URL:-http://localhost:8000/api/v1}
    depends_on:
      - backend
    networks:
      - pawreach_staging_net
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: pawreach_staging_backend
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=${DATABASE_URL:-postgresql://pawsos:pawsos_staging_password@db:5432/pawsos_staging}
      - REDIS_URL=${REDIS_URL:-redis://:redis_staging_password@redis:6379/0}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:-staging_jwt_secret_key_at_least_32_characters_long_pawreach!}
      - JWT_ALGORITHM=HS256
      - ACCESS_TOKEN_EXPIRE_MINUTES=30
      - REFRESH_TOKEN_EXPIRE_DAYS=7
      - CORS_ORIGINS=${CORS_ORIGINS:-http://localhost,http://localhost:80,http://127.0.0.1}
      - ENVIRONMENT=staging
      - STORAGE_PROVIDER=${STORAGE_PROVIDER:-local}
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID:-}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY:-}
      - AWS_REGION=${AWS_REGION:-us-east-1}
      - S3_BUCKET_NAME=${S3_BUCKET_NAME:-}
      - FIREBASE_CREDENTIALS_PATH=${FIREBASE_CREDENTIALS_PATH:-}
      - SENTRY_DSN=${SENTRY_DSN:-}
      - COOKIE_SECURE=${COOKIE_SECURE:-true}
      - COOKIE_SAMESITE=lax
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - pawreach_staging_net
    restart: unless-stopped

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: pawreach_staging_worker
    command: celery -A app.tasks.celery_app.celery_app worker --loglevel=INFO -Q dispatch,notifications,default
    environment:
      - DATABASE_URL=${DATABASE_URL:-postgresql://pawsos:pawsos_staging_password@db:5432/pawsos_staging}
      - REDIS_URL=${REDIS_URL:-redis://:redis_staging_password@redis:6379/0}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:-staging_jwt_secret_key_at_least_32_characters_long_pawreach!}
      - ENVIRONMENT=staging
      - STORAGE_PROVIDER=${STORAGE_PROVIDER:-local}
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID:-}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY:-}
      - AWS_REGION=${AWS_REGION:-us-east-1}
      - S3_BUCKET_NAME=${S3_BUCKET_NAME:-}
      - FIREBASE_CREDENTIALS_PATH=${FIREBASE_CREDENTIALS_PATH:-}
      - CELERY_HEARTBEAT_INTERVAL_SECONDS=5.0
      - CELERY_HEARTBEAT_TTL_SECONDS=60
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - pawreach_staging_net
    restart: unless-stopped

  beat:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: pawreach_staging_beat
    command: celery -A app.tasks.celery_app.celery_app beat --loglevel=INFO
    environment:
      - DATABASE_URL=${DATABASE_URL:-postgresql://pawsos:pawsos_staging_password@db:5432/pawsos_staging}
      - REDIS_URL=${REDIS_URL:-redis://:redis_staging_password@redis:6379/0}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:-staging_jwt_secret_key_at_least_32_characters_long_pawreach!}
      - ENVIRONMENT=staging
      - DISPATCH_BEAT_INTERVAL_SECONDS=2.0
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - pawreach_staging_net
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: pawreach_staging_redis
    command: redis-server --requirepass ${REDIS_PASSWORD:-redis_staging_password}
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-redis_staging_password}", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - pawreach_staging_net
    restart: unless-stopped

  db:
    image: postgis/postgis:15-3.4
    container_name: pawreach_staging_db
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-pawsos}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-pawsos_staging_password}
      - POSTGRES_DB=${POSTGRES_DB:-pawsos_staging}
    ports:
      - "5432:5432"
    volumes:
      - staging_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-pawsos} -d ${POSTGRES_DB:-pawsos_staging}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - pawreach_staging_net
    restart: unless-stopped

volumes:
  staging_postgres_data:

networks:
  pawreach_staging_net:
    driver: bridge
