version: '3.8'

services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: pawsos_frontend
    ports:
      - "5173:5173"
    environment:
      - VITE_API_BASE_URL=http://localhost:8000/api/v1
    depends_on:
      - backend
    networks:
      - pawsos_network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: pawsos_backend
    ports:
      - "8000:8000"
    volumes:
      - ./backend/uploads:/app/uploads
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/pawsos
      - REDIS_URL=redis://redis:6379/0
      - JWT_SECRET_KEY=dev_secret_key_change_in_production_32chars_long!!
      - JWT_ALGORITHM=HS256
      - ACCESS_TOKEN_EXPIRE_MINUTES=30
      - REFRESH_TOKEN_EXPIRE_DAYS=7
      - CORS_ORIGINS=http://localhost:5173,http://127.0.0.1:5173,http://localhost:3000
      - ENVIRONMENT=development
      - STORAGE_PROVIDER=local
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - pawsos_network

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: pawsos_worker
    command: celery -A app.tasks.celery_app worker -B --loglevel=info
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/pawsos
      - REDIS_URL=redis://redis:6379/0
      - JWT_SECRET_KEY=dev_secret_key_change_in_production_32chars_long!!
      - ENVIRONMENT=development
      - STORAGE_PROVIDER=local
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - pawsos_network

  redis:
    image: redis:7-alpine
    container_name: pawsos_redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - pawsos_network

  db:
    image: postgis/postgis:15-3.4
    container_name: pawsos_db
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=pawsos
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - pawsos_network

volumes:
  postgres_data:

networks:
  pawsos_network:
    driver: bridge
