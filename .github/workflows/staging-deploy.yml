name: Staging Deployment & Smoke Tests

on:
  workflow_dispatch:
    inputs:
      force_smoke_test:
        description: "Run smoke test against staging URLs even if no deploy hook triggered"
        required: false
        default: false
        type: boolean
  workflow_run:
    workflows: ["PawReach CI / CD Pipeline"]
    types: [completed]
    branches: [main]

concurrency:
  group: staging-deployment
  cancel-in-progress: false

jobs:
  check-prerequisites:
    name: Check Deployment Prerequisites
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success')
    environment: staging
    outputs:
      has_deploy_hook: ${{ steps.check.outputs.has_deploy_hook }}
      has_staging_urls: ${{ steps.check.outputs.has_staging_urls }}
      expected_git_sha: ${{ steps.resolve_sha.outputs.expected_git_sha }}
    steps:
      - name: Resolve Expected Git SHA
        id: resolve_sha
        run: |
          if [ "${{ github.event_name }}" = "workflow_run" ]; then
            RESOLVED_SHA="${{ github.event.workflow_run.head_sha }}"
          else
            RESOLVED_SHA="${{ github.sha }}"
          fi
          echo "Expected Git SHA resolved to: $RESOLVED_SHA"
          echo "expected_git_sha=$RESOLVED_SHA" >> $GITHUB_OUTPUT

      - name: Verify Staging Secrets Configuration
        id: check
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
          STAGING_API_URL: ${{ secrets.STAGING_API_URL }}
          STAGING_FRONTEND_URL: ${{ secrets.STAGING_FRONTEND_URL }}
        run: |
          echo "=== PawReach Staging CD Gate ==="
          HAS_DEPLOY_HOOK="false"
          HAS_STAGING_URLS="false"

          if [ -n "$RENDER_DEPLOY_HOOK_URL" ]; then
            HAS_DEPLOY_HOOK="true"
            echo "Deploy hook configured."
          else
            echo "RENDER_DEPLOY_HOOK_URL is not configured in GitHub Environment 'staging'."
          fi

          if [ -n "$STAGING_API_URL" ] && [ -n "$STAGING_FRONTEND_URL" ]; then
            HAS_STAGING_URLS="true"
            echo "Staging target URLs configured ($STAGING_API_URL, $STAGING_FRONTEND_URL)."
          else
            echo "Staging URLs (STAGING_API_URL, STAGING_FRONTEND_URL) are not configured."
          fi

          echo "has_deploy_hook=$HAS_DEPLOY_HOOK" >> $GITHUB_OUTPUT
          echo "has_staging_urls=$HAS_STAGING_URLS" >> $GITHUB_OUTPUT

          if [ "$HAS_DEPLOY_HOOK" = "false" ] && [ "$HAS_STAGING_URLS" = "false" ]; then
            echo "CRITICAL: No staging deployment credentials configured. Deployment will be skipped."
            if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.force_smoke_test }}" != "true" ]; then
              echo "Manual trigger aborted: missing RENDER_DEPLOY_HOOK_URL and STAGING_API_URL."
              exit 1
            fi
          fi

  trigger-deployment:
    name: Trigger Staging Cloud Deployment
    runs-on: ubuntu-latest
    needs: [check-prerequisites]
    if: needs.check-prerequisites.outputs.has_deploy_hook == 'true'
    environment: staging
    outputs:
      render_deploy_id: ${{ steps.deploy_hook.outputs.render_deploy_id }}
      render_http_status: ${{ steps.deploy_hook.outputs.render_http_status }}
    steps:
      - name: Trigger Render Staging Deployment
        id: deploy_hook
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
          EXPECTED_GIT_SHA: ${{ needs.check-prerequisites.outputs.expected_git_sha }}
        run: |
          echo "Dispatching deployment hook to Render for ref: $EXPECTED_GIT_SHA..."
          HOOK_URL="$RENDER_DEPLOY_HOOK_URL"
          if [ -n "$EXPECTED_GIT_SHA" ]; then
            if [[ "$HOOK_URL" == *"?"* ]]; then
              HOOK_URL="${HOOK_URL}&ref=${EXPECTED_GIT_SHA}"
            else
              HOOK_URL="${HOOK_URL}?ref=${EXPECTED_GIT_SHA}"
            fi
          fi

          RESPONSE_FILE=$(mktemp)
          HTTP_STATUS=$(curl -s -S -w "%{http_code}" -o "$RESPONSE_FILE" -X POST "$HOOK_URL" || echo "000")
          RESPONSE_BODY=$(cat "$RESPONSE_FILE" 2>/dev/null || echo "")
          rm -f "$RESPONSE_FILE"

          echo "render_http_status=$HTTP_STATUS" >> $GITHUB_OUTPUT

          if [ "$HTTP_STATUS" -ge 200 ] && [ "$HTTP_STATUS" -lt 300 ]; then
            echo "Render deploy hook accepted with HTTP $HTTP_STATUS."
            
            DEPLOY_ID=$(echo "$RESPONSE_BODY" | python3 -c '
              import sys, json
              try:
                  data = json.loads(sys.stdin.read())
                  dep = data.get("deploy", {})
                  if isinstance(dep, dict) and dep.get("id"):
                      print(dep.get("id"))
                  elif data.get("id"):
                      print(data.get("id"))
                  else:
                      print("")
              except Exception:
                  print("")
              ' 2>/dev/null || echo "")

            if [ -n "$DEPLOY_ID" ]; then
              echo "Render Deploy ID: $DEPLOY_ID"
              echo "render_deploy_id=$DEPLOY_ID" >> $GITHUB_OUTPUT
            else
              echo "Render Deploy ID: not provided in response"
              echo "render_deploy_id=unknown" >> $GITHUB_OUTPUT
            fi
          else
            echo "Failed to trigger Render deployment. HTTP status: $HTTP_STATUS"
            CLEAN_ERR=$(echo "$RESPONSE_BODY" | python3 -c '
              import sys, json
              try:
                  data = json.loads(sys.stdin.read())
                  print(data.get("message", ""))
              except Exception:
                  print("")
              ' 2>/dev/null || echo "")
            if [ -n "$CLEAN_ERR" ]; then
              echo "Provider message: $CLEAN_ERR"
            fi
            exit 1
          fi

  await-deployment-and-verify:
    name: Await Deployment & Run Staging Smoke Tests
    runs-on: ubuntu-latest
    needs: [check-prerequisites, trigger-deployment]
    if: always() && needs.check-prerequisites.result == 'success' && (needs.trigger-deployment.result == 'success' || needs.trigger-deployment.result == 'skipped') && needs.check-prerequisites.outputs.has_staging_urls == 'true'
    environment: staging
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Smoke Test Dependencies
        run: pip install httpx pyyaml

      - name: Bounded Polling for Staging API Deployment
        env:
          STAGING_API_URL: ${{ secrets.STAGING_API_URL }}
          EXPECTED_GIT_SHA: ${{ needs.check-prerequisites.outputs.expected_git_sha }}
          RENDER_DEPLOY_ID: ${{ needs.trigger-deployment.outputs.render_deploy_id }}
          RENDER_HTTP_STATUS: ${{ needs.trigger-deployment.outputs.render_http_status }}
        run: |
          echo "Polling Staging API for expected deployment SHA: $EXPECTED_GIT_SHA"
          if [ -n "$RENDER_DEPLOY_ID" ] && [ "$RENDER_DEPLOY_ID" != "unknown" ]; then
            echo "Associated Render Deploy ID: $RENDER_DEPLOY_ID"
          fi
          API_HEALTH_URL="${STAGING_API_URL%/}/api/v1/health"
          READY_URL="${STAGING_API_URL%/}/api/v1/health/ready"
          
          MAX_ATTEMPTS=90
          POLL_INTERVAL=10
          DEPLOYED="false"
          LAST_RESPONSE=""
          LAST_OBSERVED_SHA="none"
          LAST_OBSERVED_ENV="unknown"
          LAST_HTTP_STATUS="none"

          for i in $(seq 1 $MAX_ATTEMPTS); do
            echo "[$i/$MAX_ATTEMPTS] Probing $API_HEALTH_URL..."
            RESPONSE=$(curl -s -w "\nHTTP_STATUS:%{http_code}" "$API_HEALTH_URL" || true)
            STATUS_CODE=$(echo "$RESPONSE" | grep "HTTP_STATUS:" | cut -d':' -f2)
            BODY=$(echo "$RESPONSE" | grep -v "HTTP_STATUS:")
            LAST_RESPONSE="$BODY"
            LAST_HTTP_STATUS="$STATUS_CODE"

            if [ "$STATUS_CODE" = "200" ]; then
              CURRENT_SHA=$(echo "$BODY" | python -c "import sys, json; print(json.load(sys.stdin).get('git_sha', ''))" 2>/dev/null || echo "")
              CURRENT_ENV=$(echo "$BODY" | python -c "import sys, json; print(json.load(sys.stdin).get('environment', ''))" 2>/dev/null || echo "")
              STATUS_VAL=$(echo "$BODY" | python -c "import sys, json; print(json.load(sys.stdin).get('status', ''))" 2>/dev/null || echo "")
              LAST_OBSERVED_SHA="$CURRENT_SHA"
              LAST_OBSERVED_ENV="$CURRENT_ENV"
              
              echo "  -> status: '$STATUS_VAL', env: '$CURRENT_ENV', deployed sha: '$CURRENT_SHA'"

              if [ "$STATUS_VAL" = "ok" ] && [ "$CURRENT_ENV" = "staging" ]; then
                if [ -z "$EXPECTED_GIT_SHA" ] || [ "$CURRENT_SHA" = "$EXPECTED_GIT_SHA" ]; then
                  echo "API successfully deployed with matching SHA ($CURRENT_SHA)."
                  DEPLOYED="true"
                  break
                else
                  echo "  -> SHA mismatch: deployed '$CURRENT_SHA' != expected '$EXPECTED_GIT_SHA'. Waiting for rollout..."
                fi
              fi
            else
              echo "  -> HTTP $STATUS_CODE received. Waiting for API to warm up..."
            fi

            sleep $POLL_INTERVAL
          done

          if [ "$DEPLOYED" != "true" ]; then
            echo ""
            echo "========================================================================"
            echo "DEPLOYMENT ROLLOUT TIMEOUT DIAGNOSTIC"
            echo "========================================================================"
            echo "Expected SHA:            $EXPECTED_GIT_SHA"
            echo "Last Observed SHA:       $LAST_OBSERVED_SHA"
            echo "Environment:             $LAST_OBSERVED_ENV"
            echo "Last HTTP Status:        $LAST_HTTP_STATUS"
            echo "Render Deploy ID:        ${RENDER_DEPLOY_ID:-unknown}"
            echo ""
            echo "Guidance:"
            echo "The Staging API did not report the expected commit within $((MAX_ATTEMPTS * POLL_INTERVAL))s."
            echo "Inspect the deploy status in the Render dashboard: https://dashboard.render.com"
            if [ -n "$RENDER_DEPLOY_ID" ] && [ "$RENDER_DEPLOY_ID" != "unknown" ]; then
              echo "Verify whether Render deploy '$RENDER_DEPLOY_ID' is currently queued, building, or failed."
            else
              echo "Verify whether a deployment build was queued or blocked by concurrency limits on the free tier."
            fi
            echo "========================================================================"
            echo "Last raw API response: $LAST_RESPONSE"
            exit 1
          fi

      - name: Execute Automated Staging Smoke Suite
        env:
          STAGING_API_URL: ${{ secrets.STAGING_API_URL }}
          STAGING_FRONTEND_URL: ${{ secrets.STAGING_FRONTEND_URL }}
          EXPECTED_GIT_SHA: ${{ needs.check-prerequisites.outputs.expected_git_sha }}
        run: |
          python scripts/staging_smoke_test.py \
            --api-url "$STAGING_API_URL" \
            --frontend-url "$STAGING_FRONTEND_URL" \
            --expected-sha "$EXPECTED_GIT_SHA"

