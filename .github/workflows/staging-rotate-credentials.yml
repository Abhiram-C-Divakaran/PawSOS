name: Rotate Staging Pilot Credentials

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: "Type ROTATE_PAWREACH_STAGING_CREDENTIALS to confirm"
        required: true
        type: string

concurrency:
  group: staging-credential-rotation
  cancel-in-progress: false

jobs:
  rotate-staging-credentials:
    name: Rotate Designated Staging Credentials
    runs-on: ubuntu-latest
    environment: staging
    permissions:
      contents: read

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Set up Python 3.12.14
        uses: actions/setup-python@v7
        with:
          python-version: '3.12.14'

      - name: Install Rotation Dependencies
        run: python -m pip install --disable-pip-version-check argon2-cffi psycopg2-binary

      - name: Validate Required Staging Secrets
        env:
          STAGING_DATABASE_URL: ${{ secrets.STAGING_DATABASE_URL }}
          STAGING_SEED_PASSWORD: ${{ secrets.STAGING_SEED_PASSWORD }}
        run: |
          if [ -z "$STAGING_DATABASE_URL" ]; then
            echo "Error: STAGING_DATABASE_URL is not configured in GitHub Environment 'staging'."
            exit 1
          fi
          if [ -z "$STAGING_SEED_PASSWORD" ]; then
            echo "Error: STAGING_SEED_PASSWORD is not configured in GitHub Environment 'staging'."
            exit 1
          fi

      - name: Verify Exact Staging Account Allowlist
        env:
          TARGET_ENVIRONMENT: staging
          ROTATION_CONFIRMATION: ${{ inputs.confirmation }}
          STAGING_DATABASE_URL: ${{ secrets.STAGING_DATABASE_URL }}
          STAGING_SEED_PASSWORD: ${{ secrets.STAGING_SEED_PASSWORD }}
        run: python backend/scripts/rotate_staging_credentials.py --dry-run

      - name: Rotate Staging Credentials Atomically
        env:
          TARGET_ENVIRONMENT: staging
          ROTATION_CONFIRMATION: ${{ inputs.confirmation }}
          STAGING_DATABASE_URL: ${{ secrets.STAGING_DATABASE_URL }}
          STAGING_SEED_PASSWORD: ${{ secrets.STAGING_SEED_PASSWORD }}
        run: python backend/scripts/rotate_staging_credentials.py
