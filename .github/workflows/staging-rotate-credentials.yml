name: Reconcile Staging Pilot Credentials

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: "Type ROTATE_PAWREACH_STAGING_CREDENTIALS to confirm"
        required: true
        type: string

concurrency:
  group: staging-credential-rotation
  cancel-in-progress: false

jobs:
  rotate-staging-credentials:
    name: Reconcile Designated Staging Credentials
    runs-on: ubuntu-latest
    environment: staging
    permissions:
      contents: read

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Set up Python 3.12.14
        uses: actions/setup-python@v7
        with:
          python-version: '3.12.14'

      - name: Install Backend Dependencies
        run: python -m pip install --disable-pip-version-check -r backend/requirements.txt

      - name: Validate Required Staging Secrets
        env:
          STAGING_DATABASE_URL: ${{ secrets.STAGING_DATABASE_URL }}
          STAGING_SEED_PASSWORD: ${{ secrets.STAGING_SEED_PASSWORD }}
        run: |
          if [ -z "$STAGING_DATABASE_URL" ]; then
            echo "Error: STAGING_DATABASE_URL is not configured in GitHub Environment 'staging'."
            exit 1
          fi
          if [ -z "$STAGING_SEED_PASSWORD" ]; then
            echo "Error: STAGING_SEED_PASSWORD is not configured in GitHub Environment 'staging'."
            exit 1
          fi

      - name: Validate Operator Confirmation
        env:
          ROTATION_CONFIRMATION: ${{ inputs.confirmation }}
        run: |
          if [ "$ROTATION_CONFIRMATION" != "ROTATE_PAWREACH_STAGING_CREDENTIALS" ]; then
            echo "Error: confirmation phrase is invalid."
            exit 1
          fi

      - name: Reconcile Canonical Staging Pilot Fixture
        env:
          ENVIRONMENT: staging
          PROCESS_TYPE: maintenance
          DATABASE_URL: ${{ secrets.STAGING_DATABASE_URL }}
          STAGING_SEED_PASSWORD: ${{ secrets.STAGING_SEED_PASSWORD }}
          STAGING_RECONCILE_EXISTING: "true"
          JWT_SECRET_KEY: "github-actions-staging-maintenance-only-not-runtime-secret"
          REDIS_URL: "redis://localhost:6379/0"
          STORAGE_PROVIDER: local
          REQUIRE_FIREBASE: "false"
        run: python backend/scripts/seed_staging.py

      - name: Verify Exact Staging Account Allowlist After Reconciliation
        env:
          TARGET_ENVIRONMENT: staging
          ROTATION_CONFIRMATION: ${{ inputs.confirmation }}
          STAGING_DATABASE_URL: ${{ secrets.STAGING_DATABASE_URL }}
          STAGING_SEED_PASSWORD: ${{ secrets.STAGING_SEED_PASSWORD }}
        run: python backend/scripts/rotate_staging_credentials.py --dry-run
