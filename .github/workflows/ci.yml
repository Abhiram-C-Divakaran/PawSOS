name: PawReach CI / CD Pipeline

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]

jobs:
  backend-tests:
    name: Backend Test Suite & Coverage
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install System Dependencies for GeoAlchemy2 / GDAL
        run: |
          sudo apt-get update
          sudo apt-get install -y libpq-dev gdal-bin libgdal-dev

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install pytest pytest-asyncio pytest-cov

      - name: Run Pytest Test Suite with Coverage (Enforce >= 85%)
        env:
          PYTHONPATH: backend
          JWT_SECRET_KEY: test_secret_key_for_continuous_integration_32chars!
          ENVIRONMENT: development
        run: |
          pytest backend/tests --cov=app --cov-report=term-missing --cov-fail-under=85 -v -p no:warnings

  frontend-tests:
    name: Frontend Quality & Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: Run Linting
        run: npm run lint

      - name: Run Vitest Unit Tests with Coverage
        run: npm run test:coverage

      - name: Verify Production Build
        run: npm run build

  browser-ui-contract:
    name: Mocked UI Contract Suite (Playwright)
    runs-on: ubuntu-latest
    needs: [backend-tests, frontend-tests]
    defaults:
      run:
        working-directory: ./frontend
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps chromium

      - name: Run Playwright Mocked UI Contract Tests
        env:
          CI: true
        run: npm run test:e2e:ui-contract

      - name: Upload UI Contract Playwright Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-ui-contract-report
          path: frontend/playwright-report/
          retention-days: 7

  fullstack-e2e:
    name: Full-Stack E2E Integration Suite (Unmocked Playwright)
    runs-on: ubuntu-latest
    needs: [backend-tests, frontend-tests]
    services:
      postgres:
        image: postgis/postgis:15-3.3
        env:
          POSTGRES_DB: pawsos_test
          POSTGRES_USER: pawsos
          POSTGRES_PASSWORD: pawsos_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install System Dependencies for GeoAlchemy2 / GDAL
        run: |
          sudo apt-get update
          sudo apt-get install -y libpq-dev gdal-bin libgdal-dev

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install psycopg2-binary uvicorn

      - name: Install Frontend Dependencies & Playwright
        working-directory: ./frontend
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Run Database Migrations on PostGIS
        env:
          DATABASE_URL: postgresql://pawsos:pawsos_password@localhost:5432/pawsos_test
        working-directory: ./backend
        run: |
          alembic upgrade head

      - name: Seed Database with Deterministic E2E Fixtures
        env:
          DATABASE_URL: postgresql://pawsos:pawsos_password@localhost:5432/pawsos_test
          PYTHONPATH: backend
        run: |
          python backend/scripts/seed_e2e.py

      - name: Start FastAPI Backend Server
        env:
          DATABASE_URL: postgresql://pawsos:pawsos_password@localhost:5432/pawsos_test
          REDIS_URL: redis://localhost:6379/0
          JWT_SECRET_KEY: test_secret_key_for_continuous_integration_32chars!
          ENVIRONMENT: development
        run: |
          nohup python -m uvicorn app.main:app --host 127.0.0.1 --port 8000 --app-dir backend > backend.log 2>&1 &
          echo "Waiting for FastAPI backend to be healthy..."
          for i in {1..30}; do
            if curl -s http://127.0.0.1:8000/api/v1/health | grep -q '"status":"healthy"'; then
              echo "FastAPI backend is online and healthy!"
              break
            fi
            sleep 1
          done

      - name: Run Unmocked Full-Stack Playwright Tests
        env:
          CI: true
          E2E_BASE_URL: http://127.0.0.1:5173
          VITE_API_BASE_URL: http://127.0.0.1:8000/api/v1
        working-directory: ./frontend
        run: |
          npm run test:e2e:fullstack

      - name: Output Backend Logs on Failure
        if: failure()
        run: |
          echo "=== Backend Log Output ==="
          cat backend.log || true

      - name: Upload Full-Stack Playwright Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-fullstack-report
          path: frontend/playwright-report/
          retention-days: 7
