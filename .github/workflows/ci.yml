name: PawReach CI / CD Pipeline

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]

jobs:
  backend-tests:
    name: Backend Test Suite & Coverage
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:15-3.3
        env:
          POSTGRES_DB: pawsos_test
          POSTGRES_USER: pawsos
          POSTGRES_PASSWORD: pawsos_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pawsos -d pawsos_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install System Dependencies for GeoAlchemy2 / GDAL / PostgreSQL
        run: |
          sudo apt-get update
          sudo apt-get install -y libpq-dev gdal-bin libgdal-dev postgresql-client

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install psycopg2-binary pytest pytest-asyncio pytest-cov

      - name: Fresh PostGIS Database Migration Regression Gate
        env:
          DATABASE_URL: postgresql://pawsos:pawsos_password@localhost:5432/pawsos_test
          PGPASSWORD: pawsos_password
        working-directory: ./backend
        run: |
          pg_isready -h localhost -p 5432 -U pawsos -d pawsos_test
          psql -h localhost -U pawsos -d pawsos_test -c "CREATE EXTENSION IF NOT EXISTS postgis;"
          psql -h localhost -U pawsos -d pawsos_test -c "SELECT PostGIS_Version();"
          alembic upgrade head
          CURRENT_REV=$(alembic current | tr -d '\r' | awk '{print $1}')
          HEAD_REV=$(alembic heads | tr -d '\r' | awk '{print $1}')
          echo "Alembic Current: $CURRENT_REV, Head: $HEAD_REV"
          if [ "$CURRENT_REV" != "$HEAD_REV" ]; then
            echo "ERROR: Alembic current does not match head after migration!"
            exit 1
          fi

      - name: Incremental Existing-Database Migration Regression Gate (Phase 3A -> Head)
        env:
          DATABASE_URL: postgresql://pawsos:pawsos_password@localhost:5432/pawsos_incremental
          PGPASSWORD: pawsos_password
        working-directory: ./backend
        run: |
          # STEP A: Create a clean PostgreSQL + PostGIS database and upgrade to Phase 3A (a1b2c3d4e5f6)
          psql -h localhost -U pawsos -d pawsos_test -c "DROP DATABASE IF EXISTS pawsos_incremental;"
          psql -h localhost -U pawsos -d pawsos_test -c "CREATE DATABASE pawsos_incremental;"
          psql -h localhost -U pawsos -d pawsos_incremental -c "CREATE EXTENSION IF NOT EXISTS postgis;"
          
          alembic upgrade a1b2c3d4e5f6
          CURRENT_REV=$(alembic current | tr -d '\r' | awk '{print $1}')
          echo "Current revision at Phase 3A: $CURRENT_REV"
          if [ "$CURRENT_REV" != "a1b2c3d4e5f6" ]; then
            echo "ERROR: Database is not at Phase 3A revision a1b2c3d4e5f6!"
            exit 1
          fi
          
          # Confirm rescue_priority_enum exists and is used by rescue_cases.triage_priority
          ENUM_EXISTS=$(psql -h localhost -U pawsos -d pawsos_incremental -t -A -c "SELECT count(*) FROM pg_type WHERE typname = 'rescue_priority_enum';")
          if [ "$ENUM_EXISTS" != "1" ]; then
            echo "ERROR: rescue_priority_enum does not exist in pg_type at Phase 3A!"
            exit 1
          fi
          
          COL_UDT=$(psql -h localhost -U pawsos -d pawsos_incremental -t -A -c "SELECT udt_name FROM information_schema.columns WHERE table_name = 'rescue_cases' AND column_name = 'triage_priority';")
          if [ "$COL_UDT" != "rescue_priority_enum" ]; then
            echo "ERROR: rescue_cases.triage_priority does not use rescue_priority_enum!"
            exit 1
          fi

          # STEP B: Run a NEW independent command/process: alembic upgrade head
          # This simulates Render deploying a new application version against an already migrated Supabase staging database
          alembic upgrade head
          NEW_CURRENT_REV=$(alembic current | tr -d '\r' | awk '{print $1}')
          HEAD_REV=$(alembic heads | tr -d '\r' | awk '{print $1}')
          echo "Incremental upgrade result - Current: $NEW_CURRENT_REV, Head: $HEAD_REV"
          if [ "$NEW_CURRENT_REV" != "$HEAD_REV" ]; then
            echo "ERROR: Alembic current does not match head after incremental migration!"
            exit 1
          fi

          # STEP C: Verify rescue_priority_enum values and shared usage across tables
          ENUM_LABELS=$(psql -h localhost -U pawsos -d pawsos_incremental -t -A -c "SELECT enumlabel FROM pg_enum JOIN pg_type ON pg_enum.enumtypid = pg_type.oid WHERE pg_type.typname = 'rescue_priority_enum' ORDER BY enumsortorder;")
          EXPECTED_LABELS=$(printf "GENERAL\nMODERATE\nURGENT\nCRITICAL")
          if [ "$ENUM_LABELS" != "$EXPECTED_LABELS" ]; then
            echo "ERROR: Enum labels do not match expected! Got:"
            echo "$ENUM_LABELS"
            exit 1
          fi

          ASSESS_UDT=$(psql -h localhost -U pawsos -d pawsos_incremental -t -A -c "SELECT udt_name FROM information_schema.columns WHERE table_name = 'triage_assessments' AND column_name = 'suggested_priority';")
          if [ "$ASSESS_UDT" != "rescue_priority_enum" ]; then
            echo "ERROR: triage_assessments.suggested_priority does not use rescue_priority_enum!"
            exit 1
          fi

          echo "SUCCESS: Incremental migration Phase 3A -> Head passed with shared enum reuse confirmed."

      - name: Run Pytest Test Suite with Coverage (Enforce >= 85%)
        env:
          PYTHONPATH: backend
          JWT_SECRET_KEY: test_secret_key_for_continuous_integration_32chars!
          ENVIRONMENT: development
        run: |
          pytest backend/tests --cov=app --cov-report=term-missing --cov-fail-under=85 -v -p no:warnings

  frontend-tests:
    name: Frontend Quality & Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: Run Linting
        run: npm run lint

      - name: Run Vitest Unit Tests with Coverage
        run: npm run test:coverage

      - name: Verify Production Build
        run: npm run build

  browser-ui-contract:
    name: Mocked UI Contract Suite (Playwright)
    runs-on: ubuntu-latest
    needs: [backend-tests, frontend-tests]
    defaults:
      run:
        working-directory: ./frontend
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps chromium

      - name: Run Playwright Mocked UI Contract Tests
        env:
          CI: true
        run: npm run test:e2e:ui-contract

      - name: Upload UI Contract Playwright Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-ui-contract-report
          path: frontend/playwright-report/
          retention-days: 7

  fullstack-e2e:
    name: Full-Stack E2E Integration Suite (Unmocked Playwright)
    runs-on: ubuntu-latest
    needs: [backend-tests, frontend-tests]
    services:
      postgres:
        image: postgis/postgis:15-3.3
        env:
          POSTGRES_DB: pawsos_test
          POSTGRES_USER: pawsos
          POSTGRES_PASSWORD: pawsos_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pawsos -d pawsos_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install System Dependencies for GeoAlchemy2 / GDAL / PostgreSQL / Redis
        run: |
          sudo apt-get update
          sudo apt-get install -y libpq-dev gdal-bin libgdal-dev postgresql-client redis-tools

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install psycopg2-binary uvicorn celery redis

      - name: Verify Redis Service Connectivity
        run: |
          redis-cli -h localhost -p 6379 ping

      - name: Verify PostgreSQL & PostGIS Container Readiness
        env:
          PGPASSWORD: pawsos_password
        run: |
          pg_isready -h localhost -p 5432 -U pawsos -d pawsos_test
          psql -h localhost -U pawsos -d pawsos_test -c "CREATE EXTENSION IF NOT EXISTS postgis;"
          psql -h localhost -U pawsos -d pawsos_test -c "SELECT PostGIS_Version();"

      - name: Run Database Migrations on PostGIS
        env:
          DATABASE_URL: postgresql://pawsos:pawsos_password@localhost:5432/pawsos_test
        working-directory: ./backend
        run: |
          alembic upgrade head
          CURRENT_REV=$(alembic current | tr -d '\r' | awk '{print $1}')
          HEAD_REV=$(alembic heads | tr -d '\r' | awk '{print $1}')
          echo "Alembic Current: $CURRENT_REV, Head: $HEAD_REV"
          if [ "$CURRENT_REV" != "$HEAD_REV" ]; then
            echo "ERROR: Alembic current does not match head after migration!"
            exit 1
          fi

      - name: Seed Database with Deterministic E2E Fixtures
        env:
          DATABASE_URL: postgresql://pawsos:pawsos_password@localhost:5432/pawsos_test
          PYTHONPATH: backend
        run: |
          python backend/scripts/seed_e2e.py

      - name: Start Celery Background Worker
        env:
          DATABASE_URL: postgresql://pawsos:pawsos_password@localhost:5432/pawsos_test
          REDIS_URL: redis://localhost:6379/0
          PYTHONPATH: backend
          DISPATCH_OFFER_EXPIRY_SECONDS: '2'
          DISPATCH_RADIUS_LEVELS: '5,10,20,40'
          DISPATCH_BEAT_INTERVAL_SECONDS: '1.0'
          CELERY_HEARTBEAT_INTERVAL_SECONDS: '2.0'
          CELERY_HEARTBEAT_TTL_SECONDS: '60'
          CELERY_HEARTBEAT_THRESHOLD_SECONDS: '60'
          ENVIRONMENT: development
        run: |
          nohup celery -A app.tasks.celery_app.celery_app worker --loglevel=INFO > celery-worker.log 2>&1 &
          sleep 2

      - name: Start Celery Beat Scheduler
        env:
          DATABASE_URL: postgresql://pawsos:pawsos_password@localhost:5432/pawsos_test
          REDIS_URL: redis://localhost:6379/0
          PYTHONPATH: backend
          DISPATCH_OFFER_EXPIRY_SECONDS: '2'
          DISPATCH_RADIUS_LEVELS: '5,10,20,40'
          DISPATCH_BEAT_INTERVAL_SECONDS: '1.0'
          CELERY_HEARTBEAT_INTERVAL_SECONDS: '2.0'
          ENVIRONMENT: development
        run: |
          nohup celery -A app.tasks.celery_app.celery_app beat --loglevel=INFO > celery-beat.log 2>&1 &
          sleep 1

      - name: Start FastAPI Backend Server
        env:
          DATABASE_URL: postgresql://pawsos:pawsos_password@localhost:5432/pawsos_test
          REDIS_URL: redis://localhost:6379/0
          JWT_SECRET_KEY: test_secret_key_for_continuous_integration_32chars!
          DISPATCH_OFFER_EXPIRY_SECONDS: '2'
          DISPATCH_RADIUS_LEVELS: '5,10,20,40'
          DISPATCH_BEAT_INTERVAL_SECONDS: '1.0'
          CELERY_HEARTBEAT_INTERVAL_SECONDS: '2.0'
          CELERY_HEARTBEAT_TTL_SECONDS: '60'
          CELERY_HEARTBEAT_THRESHOLD_SECONDS: '60'
          REQUIRE_FULL_READINESS: 'true'
          DISABLE_RATE_LIMITING: 'true'
          ENVIRONMENT: development
        run: |
          nohup python -m uvicorn app.main:app --host 127.0.0.1 --port 8000 --app-dir backend > backend.log 2>&1 &
          echo "Waiting for FastAPI backend to be online..."
          for i in {1..30}; do
            if curl --fail --silent http://127.0.0.1:8000/api/v1/health > /dev/null; then
              echo "FastAPI backend is online!"
              break
            fi
            if [ "$i" -eq 30 ]; then
              echo "Backend failed to become healthy within 30 seconds"
              cat backend.log || true
              exit 1
            fi
            sleep 1
          done

      - name: Wait for Full Operational Readiness Probe
        run: |
          echo "Waiting for /api/v1/health/ready to report ready state..."
          for i in {1..30}; do
            READY_STATUS=$(curl -s http://127.0.0.1:8000/api/v1/health/ready | grep -o '"status":"[^"]*"' | head -n 1 | cut -d'"' -f4)
            if [ "$READY_STATUS" = "ready" ]; then
              echo "Full operational readiness verified: Database, PostGIS, Redis, and Celery Worker are active!"
              curl -s http://127.0.0.1:8000/api/v1/health/ready
              break
            fi
            if [ "$i" -eq 30 ]; then
              echo "System failed to become ready. Status: $READY_STATUS"
              curl -s http://127.0.0.1:8000/api/v1/health/ready || true
              cat backend.log || true
              cat celery-worker.log || true
              cat celery-beat.log || true
              exit 1
            fi
            sleep 1
          done

      - name: Install Frontend Dependencies & Playwright
        working-directory: ./frontend
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Run Unmocked Full-Stack Playwright Tests
        env:
          CI: true
          E2E_BASE_URL: http://127.0.0.1:5173
          VITE_API_BASE_URL: http://127.0.0.1:8000/api/v1
          DISPATCH_OFFER_EXPIRY_SECONDS: '2'
        working-directory: ./frontend
        run: |
          npm run test:e2e:fullstack

      - name: Output Diagnostic Logs on Failure
        if: failure()
        run: |
          echo "=== Backend Log Output ==="
          cat backend.log || true
          echo "=== Celery Worker Log Output ==="
          cat celery-worker.log || true
          echo "=== Celery Beat Log Output ==="
          cat celery-beat.log || true

      - name: Upload Full-Stack Playwright Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-fullstack-report
          path: frontend/playwright-report/
          retention-days: 7

      - name: Upload Service Diagnostic Logs on Failure
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: service-diagnostic-logs
          path: |
            backend.log
            celery-worker.log
            celery-beat.log
          retention-days: 7

