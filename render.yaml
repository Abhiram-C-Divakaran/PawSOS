services:
  # 1. FastAPI API Web Service
  - type: web
    name: pawreach-staging-api
    env: python
    region: oregon
    plan: starter
    buildCommand: pip install -r backend/requirements.txt && alembic -c backend/alembic.ini upgrade head
    startCommand: uvicorn app.main:app --app-dir backend --host 0.0.0.0 --port $PORT --workers 2
    healthCheckPath: /api/v1/health
    envVars:
      - key: ENVIRONMENT
        value: staging
      - key: DATABASE_URL
        fromDatabase:
          name: pawreach-staging-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: pawreach-staging-redis
          property: connectionString
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: JWT_ALGORITHM
        value: HS256
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: 30
      - key: REFRESH_TOKEN_EXPIRE_DAYS
        value: 7
      - key: CORS_ORIGINS
        sync: false
      - key: STORAGE_PROVIDER
        value: s3
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false
      - key: AWS_REGION
        value: us-east-1
      - key: S3_BUCKET_NAME
        sync: false
      - key: COOKIE_SECURE
        value: "true"
      - key: SENTRY_DSN
        sync: false

  # 2. Celery Worker Background Service
  - type: worker
    name: pawreach-staging-worker
    env: python
    region: oregon
    plan: starter
    buildCommand: pip install -r backend/requirements.txt
    startCommand: celery -A app.tasks.celery_app.celery_app --workdir backend worker --loglevel=INFO -Q dispatch,notifications,default
    envVars:
      - key: ENVIRONMENT
        value: staging
      - key: DATABASE_URL
        fromDatabase:
          name: pawreach-staging-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: pawreach-staging-redis
          property: connectionString
      - key: CELERY_HEARTBEAT_INTERVAL_SECONDS
        value: 5.0
      - key: CELERY_HEARTBEAT_TTL_SECONDS
        value: 60

  # 3. Celery Beat Periodic Scheduler
  - type: worker
    name: pawreach-staging-beat
    env: python
    region: oregon
    plan: starter
    buildCommand: pip install -r backend/requirements.txt
    startCommand: celery -A app.tasks.celery_app.celery_app --workdir backend beat --loglevel=INFO
    envVars:
      - key: ENVIRONMENT
        value: staging
      - key: DATABASE_URL
        fromDatabase:
          name: pawreach-staging-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: pawreach-staging-redis
          property: connectionString
      - key: DISPATCH_BEAT_INTERVAL_SECONDS
        value: 2.0

  # 4. Redis Service
  - type: redis
    name: pawreach-staging-redis
    region: oregon
    plan: starter
    maxmemoryPolicy: noeviction
    ipAllowList: []

databases:
  # Managed PostgreSQL with PostGIS
  - name: pawreach-staging-db
    region: oregon
    plan: starter
    postgresMajorVersion: 15
