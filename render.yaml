services:
  # 1. FastAPI API Web Service
  - type: web
    name: pawreach-staging-api
    runtime: python
    region: oregon
    plan: starter
    buildCommand: cd backend && pip install -r requirements.txt
    preDeployCommand: cd backend && alembic upgrade head
    startCommand: uvicorn app.main:app --app-dir backend --host 0.0.0.0 --port $PORT --workers 2
    healthCheckPath: /api/v1/health
    envVars:
      - fromGroup: pawreach-staging-common
      - key: DATABASE_URL
        fromDatabase:
          name: pawreach-staging-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: pawreach-staging-redis
          property: connectionString
      - key: PROCESS_TYPE
        value: api
      - key: COOKIE_SECURE
        value: "true"
      - key: COOKIE_SAMESITE
        value: lax

  # 2. Celery Worker Background Service
  - type: worker
    name: pawreach-staging-worker
    runtime: python
    region: oregon
    plan: starter
    buildCommand: cd backend && pip install -r requirements.txt
    startCommand: celery -A app.tasks.celery_app.celery_app --workdir backend worker --loglevel=INFO -Q dispatch,notifications,default
    envVars:
      - fromGroup: pawreach-staging-common
      - key: DATABASE_URL
        fromDatabase:
          name: pawreach-staging-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: pawreach-staging-redis
          property: connectionString
      - key: PROCESS_TYPE
        value: worker

  # 3. Celery Beat Periodic Scheduler (Singleton)
  - type: worker
    name: pawreach-staging-beat
    runtime: python
    region: oregon
    plan: starter
    numInstances: 1
    buildCommand: cd backend && pip install -r requirements.txt
    startCommand: celery -A app.tasks.celery_app.celery_app --workdir backend beat --loglevel=INFO --pidfile=/tmp/celerybeat.pid
    envVars:
      - fromGroup: pawreach-staging-common
      - key: DATABASE_URL
        fromDatabase:
          name: pawreach-staging-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: pawreach-staging-redis
          property: connectionString
      - key: PROCESS_TYPE
        value: beat

  # 4. Frontend Static PWA Site
  - type: web
    name: pawreach-staging-frontend
    runtime: static
    buildCommand: npm --prefix frontend ci && npm --prefix frontend run build
    staticPublishPath: ./frontend/dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        sync: false
      - key: VITE_FIREBASE_API_KEY
        sync: false
      - key: VITE_FIREBASE_AUTH_DOMAIN
        sync: false
      - key: VITE_FIREBASE_PROJECT_ID
        sync: false
      - key: VITE_FIREBASE_STORAGE_BUCKET
        sync: false
      - key: VITE_FIREBASE_MESSAGING_SENDER_ID
        sync: false
      - key: VITE_FIREBASE_APP_ID
        sync: false
      - key: VITE_FIREBASE_VAPID_KEY
        sync: false

  # 5. Managed Redis / Key Value Service
  - type: keyvalue
    name: pawreach-staging-redis
    region: oregon
    plan: starter
    maxmemoryPolicy: noeviction
    ipAllowList: []

databases:
  # Managed PostgreSQL with PostGIS (15+)
  - name: pawreach-staging-db
    region: oregon
    plan: basic-256mb
    postgresMajorVersion: "15"

envVarGroups:
  - name: pawreach-staging-common
    envVars:
      - key: ENVIRONMENT
        value: staging
      - key: STORAGE_PROVIDER
        value: s3
      - key: AWS_REGION
        value: ap-south-1
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: JWT_ALGORITHM
        value: HS256
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "30"
      - key: REFRESH_TOKEN_EXPIRE_DAYS
        value: "7"
      - key: CELERY_HEARTBEAT_INTERVAL_SECONDS
        value: "10.0"
      - key: CELERY_HEARTBEAT_TTL_SECONDS
        value: "60"
      - key: DISPATCH_BEAT_INTERVAL_SECONDS
        value: "20.0"
      - key: DISPATCH_OFFER_EXPIRY_SECONDS
        value: "20"
      - key: REQUIRE_FIREBASE
        value: "false"
      - key: S3_PRESIGNED_URL_EXPIRE_SECONDS
        value: "900"
