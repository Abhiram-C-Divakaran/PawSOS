services:
  # 1. Combined FastAPI, Celery Worker, & Celery Beat Web Service (Render Free Tier)
  - type: web
    name: pawreach-api
    runtime: python
    region: oregon
    plan: free
    buildCommand: chmod +x scripts/start_free_render.sh && cd backend && pip install -r requirements.txt
    startCommand: ./scripts/start_free_render.sh
    healthCheckPath: /api/v1/health
    envVars:
      - key: ENVIRONMENT
        value: staging
      - key: PROCESS_TYPE
        value: all
      - key: STORAGE_PROVIDER
        value: s3
      - key: COOKIE_SECURE
        value: "true"
      - key: COOKIE_SAMESITE
        value: lax
      - key: REQUIRE_FIREBASE
        value: "false"
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: JWT_ALGORITHM
        value: HS256
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "30"
      - key: REFRESH_TOKEN_EXPIRE_DAYS
        value: "7"
      - key: S3_PRESIGNED_URL_EXPIRE_SECONDS
        value: "900"
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false
      - key: AWS_REGION
        sync: false
      - key: S3_BUCKET_NAME
        sync: false
      - key: S3_ENDPOINT_URL
        sync: false
      - key: S3_FORCE_PATH_STYLE
        value: "true"
      - key: DISPATCH_BEAT_INTERVAL_SECONDS
        value: "120.0"
      - key: CELERY_HEARTBEAT_INTERVAL_SECONDS
        value: "60.0"
      - key: CELERY_HEARTBEAT_TTL_SECONDS
        value: "180"
      - key: CELERY_HEARTBEAT_THRESHOLD_SECONDS
        value: "180"
      - key: FIREBASE_PROJECT_ID
        sync: false
      - key: FIREBASE_CREDENTIALS_JSON
        sync: false
      - key: AI_TRIAGE_ENABLED
        value: "false"
      - key: AI_TRIAGE_PROVIDER
        value: "disabled"
      - key: AI_TRIAGE_MIN_CONFIDENCE
        value: "0.70"

  # 2. Frontend Static PWA Site (Render Free Tier)
  - type: web
    name: pawreach-frontend
    runtime: static
    buildCommand: npm --prefix frontend ci && npm --prefix frontend run build
    staticPublishPath: ./frontend/dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        sync: false
      - key: VITE_FIREBASE_API_KEY
        sync: false
      - key: VITE_FIREBASE_AUTH_DOMAIN
        sync: false
      - key: VITE_FIREBASE_PROJECT_ID
        sync: false
      - key: VITE_FIREBASE_STORAGE_BUCKET
        sync: false
      - key: VITE_FIREBASE_MESSAGING_SENDER_ID
        sync: false
      - key: VITE_FIREBASE_APP_ID
        sync: false
      - key: VITE_FIREBASE_VAPID_KEY
        sync: false
